replicaCount: 1

image:
  repository: ghcr.io/llmservicemarketplace-del/quantum-catalyst-synthesizer
  pullPolicy: Always
  tag: "v0.1.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]

ibmQuantum:
  tokenSecretName: ""
  tokenSecretKey: IBM_QUANTUM_TOKEN
